name: 'Retrieve Version'
description: 'Reads the current version from package.json on a given branch'

inputs:
  branch:
    description: 'The branch to read package.json from'
    required: false
    default: 'main'

outputs:
  version:
    description: 'The version read from package.json'
    value: ${{ steps.get-version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Fetch branch
      shell: bash
      run: git fetch origin ${{ inputs.branch }}

    - name: Read version from package.json
      id: get-version
      shell: bash
      run: |
        VERSION=$(git show origin/${{ inputs.branch }}:package.json | jq -r '.version')
        if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
          echo "::error::Could not read version from package.json on branch ${{ inputs.branch }}"
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Retrieved version: $VERSION from branch ${{ inputs.branch }}"
