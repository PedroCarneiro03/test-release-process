name: 'Bump Version'
description: 'Updates package.json to a given version on a given branch with "npm version", and commits'

inputs:
  version:
    description: 'The version to set in package.json'
    required: true
  branch:
    description: 'The branch to checkout and commit to'
    required: true

runs:
  using: composite
  steps:
    - name: Checkout branch
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.branch }}
        fetch-depth: 0

    - name: Update version in package.json and package-lock.json
      shell: bash
      run: npm version "${{ inputs.version }}" --no-git-tag-version

    - name: Commit and push
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add package.json package-lock.json
        git commit -m "Release: Bump version to \`${{ inputs.version }}\`"
        git push origin ${{ inputs.branch }}
